name: Safe source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pexpect>=4.8,<5'
      - run: python -B scripts/audit_public_sources.py
      - name: Orchestration tests (no remote operations)
        working-directory: lab-deploy
        run: |
          python -B -m unittest discover -s tests -p 'test_controller.py' -v
          python -B -m unittest discover -s tests -p 'test_manager.py' -v
          python -B -m unittest discover -s tests -p 'test_barranco_status.py' -v
          python -B -m unittest discover -s tests -p 'test_glomap_review_worker.py' -v
          python -B -m unittest discover -s tests -p 'test_loop_vocab_worker.py' -v
      - name: Sparse binary reader tests
        working-directory: home/sparse-review
        run: python -B -m unittest -v test_app
